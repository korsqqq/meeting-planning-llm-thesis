<div class="cube-wrap">
  <svg id="cube3d" viewBox="0 0 880 470" role="img"
       aria-label="Rotatable 3D surfaces of mean satisfaction over budget cap and conflict-density band, one surface per architecture"></svg>
  <div class="cube-bar">
    <div class="cube-legend" id="cube3d-legend"></div>
    <button type="button" class="cube-btn" id="cube3d-reset">сброс ракурса</button>
  </div>
</div>
<script>
(function () {
  var DATA = __DATA__, COL = __COLOR__, CAPL = __CAPS__, BANDL = __BANDS__;
  var CONDS = ["C1", "C2", "C3", "C4", "C5"];
  var svg = document.getElementById("cube3d");
  var legendEl = document.getElementById("cube3d-legend");
  var resetEl = document.getElementById("cube3d-reset");
  var fallback = document.getElementById("cube3d-fallback");
  if (!svg || !legendEl) return;

  var NS = "http://www.w3.org/2000/svg";
  var W = 880, H = 470, PAD = 26;
  var AZ0 = -52, EL0 = 24;
  var az = AZ0, el = EL0;
  var off = {};
  var nCap = CAPL.length, nBand = BANDL.length;
  var ZTICKS = [0, 0.25, 0.5, 0.75, 1];

  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function unit(a) { var n = Math.sqrt(dot(a, a)) || 1; return [a[0] / n, a[1] / n, a[2] / n]; }
  // data coordinates (cap index, band index, satisfaction) -> centred model space
  function P(ci, bi, z) {
    return [(ci / (nCap - 1) - 0.5) * 2.0, (bi / (nBand - 1) - 0.5) * 1.45, (z - 0.5) * 1.45];
  }
  function basis() {
    var a = az * Math.PI / 180, e = el * Math.PI / 180;
    var ca = Math.cos(a), sa = Math.sin(a), ce = Math.cos(e), se = Math.sin(e);
    return { view: [ce * ca, ce * sa, se], right: [-sa, ca, 0], up: [-se * ca, -se * sa, ce] };
  }
  function mix(hex, t, tgt) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.round(r + (tgt[0] - r) * t); g = Math.round(g + (tgt[1] - g) * t); b = Math.round(b + (tgt[2] - b) * t);
    return "#" + [r, g, b].map(function (v) { return ("0" + Math.max(0, Math.min(255, v)).toString(16)).slice(-2); }).join("");
  }
  function mk(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  // Every drawable is declared in model space first, so the frame can be fitted
  // to the current rotation before anything is projected to pixels.
  function collect(V) {
    var grid = [], ticks = [], labels = [], quads = [];

    // Axis furniture goes on the edges nearest the camera, so a rotation never
    // buries a label under a surface.
    var near = function (a, b) { return dot(a, V.view) >= dot(b, V.view); };
    var capEdge = near(P(0, -0.24, 0), P(0, nBand - 1 + 0.24, 0)) ? -0.24 : nBand - 1 + 0.24;
    var capOut = capEdge < 0 ? -0.62 : nBand - 1 + 0.62;
    var bandEdge = near(P(-0.22, 0, 0), P(nCap - 1 + 0.22, 0, 0)) ? -0.22 : nCap - 1 + 0.22;
    var bandOut = bandEdge < 0 ? -0.62 : nCap - 1 + 0.62;
    var bandAnchor = bandEdge < 0 ? "end" : "start";
    var bandDx = bandEdge < 0 ? -10 : 10;

    // vertical axis at whichever outer corner projects furthest to the left
    var corner = null, bestX = Infinity;
    [-0.42, nCap - 1 + 0.42].forEach(function (cc) {
      [-0.42, nBand - 1 + 0.42].forEach(function (bb) {
        var p = P(cc, bb, 0), x = dot(p, V.right);
        if (x < bestX) { bestX = x; corner = p; }
      });
    });
    var ax = corner[0], ay = corner[1];

    for (var ci = 0; ci < nCap; ci++) grid.push([P(ci, 0, 0), P(ci, nBand - 1, 0)]);
    for (var bi = 0; bi < nBand; bi++) grid.push([P(0, bi, 0), P(nCap - 1, bi, 0)]);
    grid.push([[ax, ay, P(0, 0, 0)[2]], [ax, ay, P(0, 0, 1)[2]]]);

    ZTICKS.forEach(function (z) {
      var p = [ax, ay, P(0, 0, z)[2]];
      ticks.push(p);
      labels.push({ p: p, dx: -10, dy: 4, anchor: "end", cls: "cube-tick", t: z.toFixed(2) });
    });
    labels.push({ p: [ax, ay, P(0, 0, 0.5)[2]], dx: -48, dy: 0, anchor: "middle", cls: "cube-axis",
                  t: "mean satisfaction", rot: -90 });
    for (var ci2 = 0; ci2 < nCap; ci2++) {
      labels.push({ p: P(ci2, capEdge, 0), dx: 0, dy: 12, anchor: "middle", cls: "cube-tick", t: CAPL[ci2] });
    }
    labels.push({ p: P((nCap - 1) / 2, capOut, 0), dx: 0, dy: 16, anchor: "middle",
                  cls: "cube-axis", t: "budget cap" });
    for (var bi2 = 0; bi2 < nBand; bi2++) {
      labels.push({ p: P(bandEdge, bi2, 0), dx: bandDx, dy: 4, anchor: bandAnchor, cls: "cube-tick", t: BANDL[bi2] });
    }
    labels.push({ p: P(bandOut, (nBand - 1) / 2, 0), dx: bandDx + (bandDx < 0 ? -4 : 4), dy: 4,
                  anchor: bandAnchor, cls: "cube-axis", t: "conflict density" });

    CONDS.forEach(function (c) {
      if (off[c]) return;
      var Z = DATA[c];
      for (var bi = 0; bi < nBand - 1; bi++) {
        for (var ci = 0; ci < nCap - 1; ci++) {
          var corners = [
            P(ci, bi, Z[bi][ci]), P(ci + 1, bi, Z[bi][ci + 1]),
            P(ci + 1, bi + 1, Z[bi + 1][ci + 1]), P(ci, bi + 1, Z[bi + 1][ci])
          ];
          var cen = [0, 0, 0];
          corners.forEach(function (p) { cen[0] += p[0] / 4; cen[1] += p[1] / 4; cen[2] += p[2] / 4; });
          var nrm = unit(cross(sub(corners[1], corners[0]), sub(corners[3], corners[0])));
          var lam = Math.abs(dot(nrm, V.view));
          quads.push({
            corners: corners, d: dot(cen, V.view), cond: c,
            fill: lam > 0.62 ? mix(COL[c], (lam - 0.62) * 0.85, [255, 255, 255])
                             : mix(COL[c], (0.62 - lam) * 0.65, [0, 0, 0])
          });
        }
      }
    });
    quads.sort(function (a, b) { return a.d - b.d; });
    return { grid: grid, ticks: ticks, labels: labels, quads: quads };
  }

  // Fit the projected drawing into the viewBox, so no rotation clips a label.
  function fitter(items, V) {
    var xs = [], ys = [];
    function add(p) { xs.push(dot(p, V.right)); ys.push(-dot(p, V.up)); }
    items.grid.forEach(function (g) { add(g[0]); add(g[1]); });
    items.labels.forEach(function (l) { add(l.p); });
    items.quads.forEach(function (q) { q.corners.forEach(add); });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var s = Math.min((W - 2 * PAD - 160) / Math.max(x1 - x0, 1e-6),
                     (H - 2 * PAD - 46) / Math.max(y1 - y0, 1e-6));
    var ox = W / 2 - (x0 + x1) / 2 * s, oy = H / 2 - (y0 + y1) / 2 * s;
    return function (p) { return [ox + dot(p, V.right) * s, oy - dot(p, V.up) * s]; };
  }

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var V = basis();
    var items = collect(V);
    var pr = fitter(items, V);

    var scaff = mk("g", { class: "cube-scaffold" });
    items.grid.forEach(function (g) {
      var a = pr(g[0]), b = pr(g[1]);
      scaff.appendChild(mk("line", { x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1) }));
    });
    items.ticks.forEach(function (p) {
      var q = pr(p);
      scaff.appendChild(mk("line", { x1: q[0].toFixed(1), y1: q[1].toFixed(1), x2: (q[0] - 6).toFixed(1), y2: q[1].toFixed(1) }));
    });
    svg.appendChild(scaff);

    var g = mk("g", { class: "cube-surfaces" });
    items.quads.forEach(function (q) {
      g.appendChild(mk("polygon", {
        points: q.corners.map(function (p) { var s = pr(p); return s[0].toFixed(1) + "," + s[1].toFixed(1); }).join(" "),
        fill: q.fill, stroke: q.fill, "stroke-width": "0.7", "fill-opacity": "0.9"
      }));
    });
    svg.appendChild(g);

    var lg = mk("g", { class: "cube-labels" });
    items.labels.forEach(function (l) {
      var q = pr(l.p), x = q[0] + l.dx, y = q[1] + l.dy;
      var attrs = { x: x.toFixed(1), y: y.toFixed(1), "text-anchor": l.anchor, class: l.cls };
      if (l.rot) attrs.transform = "rotate(" + l.rot + " " + x.toFixed(1) + " " + y.toFixed(1) + ")";
      lg.appendChild(mk("text", attrs, l.t));
    });
    svg.appendChild(lg);
  }

  function drawLegend() {
    legendEl.innerHTML = "";
    CONDS.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cube-chip" + (off[c] ? " is-off" : "");
      b.setAttribute("aria-pressed", off[c] ? "false" : "true");
      b.innerHTML = '<span class="sw" style="background:' + COL[c] + '"></span>' + c;
      b.addEventListener("click", function () { off[c] = !off[c]; drawLegend(); render(); });
      legendEl.appendChild(b);
    });
  }

  var drag = null;
  svg.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, y: e.clientY, az: az, el: el };
    svg.setPointerCapture(e.pointerId);
    svg.classList.add("is-dragging");
  });
  svg.addEventListener("pointermove", function (e) {
    if (!drag) return;
    az = drag.az + (e.clientX - drag.x) * 0.45;
    el = Math.max(6, Math.min(78, drag.el - (e.clientY - drag.y) * 0.35));
    render();
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    svg.addEventListener(ev, function () { drag = null; svg.classList.remove("is-dragging"); });
  });
  svg.setAttribute("tabindex", "0");
  svg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") az -= 6;
    else if (e.key === "ArrowRight") az += 6;
    else if (e.key === "ArrowUp") el = Math.min(78, el + 4);
    else if (e.key === "ArrowDown") el = Math.max(6, el - 4);
    else return;
    e.preventDefault(); render();
  });
  if (resetEl) resetEl.addEventListener("click", function () { az = AZ0; el = EL0; render(); });

  try {
    drawLegend();
    render();
  } catch (err) {
    var wrap = svg.closest(".cube-wrap");
    if (wrap) wrap.hidden = true;
    if (fallback) fallback.hidden = false;
  }
})();
</script>
